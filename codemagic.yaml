workflows:
  english-friend:
    name: English Friend Android
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      vars:
        CM_NODE_VERSION: '22'
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Run tests
        script: |
          npx jest --no-cache
      - name: Build Android APK (Debug)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
