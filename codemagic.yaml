workflows:
  english-friend:
    name: English Friend Android
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      vars:
        CM_NODE_VERSION: '22'
    scripts:
      - name: Install dependencies (clean)
        script: |
          rm -rf node_modules
          npm ci
      - name: Run tests
        script: |
          npx jest --no-cache
      - name: Patch Hermes compiler for macOS
        script: |
          # macOS hermesc in the V1 npm package produces v96 bytecode
          # which is incompatible with Hermes V1 runtime (expects v98)
          # Replace with a wrapper that uses pre-compiled bytecode
          HERMESC_DIR="node_modules/hermes-compiler/hermesc/osx-bin"
          if [ -f "$HERMESC_DIR/hermesc" ]; then
            echo "Replacing macOS hermesc with pre-compiled bundle wrapper..."
            mv "$HERMESC_DIR/hermesc" "$HERMESC_DIR/hermesc.original"
            cat > "$HERMESC_DIR/hermesc" << 'WRAPPER'
            #!/bin/bash
            # Wrapper: use pre-compiled bundle from repo instead of compiling
            # The macOS hermesc binary produces bytecode v96 but v98 is needed
            SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
            PRECOMPILED="$SCRIPT_DIR/../../../../precompiled/index.android.bundle.hbc"
            while [[ $# -gt 0 ]]; do
              case "$1" in
                -out) OUTPUT="$2"; shift 2 ;;
                *) shift ;;
              esac
            done
            echo "Hermes wrapper: copying pre-compiled bundle to $OUTPUT"
            cp "$PRECOMPILED" "$OUTPUT"
      WRAPPER
            chmod +x "$HERMESC_DIR/hermesc"
            echo "✅ macOS hermesc patched successfully"
          else
            echo "⚠️  hermesc not found at $HERMESC_DIR"
          fi
      - name: Build Android APK (Release)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
